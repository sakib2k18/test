<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Illustration of a university bus leaving the campus">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123761"/>
      <stop offset="100%" stop-color="#0a2140"/>
    </linearGradient>
    <linearGradient id="hbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde7f5"/>
    </linearGradient>
    <linearGradient id="hglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8cc4"/>
      <stop offset="100%" stop-color="#2c5c96"/>
    </linearGradient>
  </defs>

  <rect width="720" height="470" rx="24" fill="url(#hsky)"/>

  <!-- glow -->
  <circle cx="588" cy="98" r="76" fill="#f2a71b" opacity=".26"/>
  <circle cx="588" cy="98" r="40" fill="#f2a71b" opacity=".38"/>

  <!-- campus skyline silhouette -->
  <g fill="#ffffff" opacity=".08">
    <rect x="40"  y="196" width="86"  height="132" rx="6"/>
    <rect x="138" y="164" width="66"  height="164" rx="6"/>
    <rect x="216" y="212" width="104" height="116" rx="6"/>
    <rect x="332" y="180" width="72"  height="148" rx="6"/>
    <rect x="416" y="222" width="120" height="106" rx="6"/>
    <rect x="548" y="192" width="80"  height="136" rx="6"/>
    <rect x="640" y="228" width="46"  height="100" rx="6"/>
  </g>
  <g fill="#f2a71b" opacity=".35">
    <rect x="152" y="184" width="10" height="12" rx="2"/>
    <rect x="172" y="184" width="10" height="12" rx="2"/>
    <rect x="352" y="200" width="10" height="12" rx="2"/>
    <rect x="372" y="200" width="10" height="12" rx="2"/>
    <rect x="566" y="212" width="10" height="12" rx="2"/>
  </g>

  <!-- road -->
  <rect x="0" y="352" width="720" height="118" fill="#081c37"/>
  <rect x="0" y="352" width="720" height="4" fill="#ffffff" opacity=".14"/>
  <g fill="#f2a71b" opacity=".8">
    <rect x="34"  y="432" width="72" height="7" rx="3.5"/>
    <rect x="150" y="432" width="72" height="7" rx="3.5"/>
    <rect x="266" y="432" width="72" height="7" rx="3.5"/>
    <rect x="382" y="432" width="72" height="7" rx="3.5"/>
    <rect x="498" y="432" width="72" height="7" rx="3.5"/>
    <rect x="614" y="432" width="72" height="7" rx="3.5"/>
  </g>

  <!-- bus -->
  <g>
    <ellipse cx="360" cy="392" rx="252" ry="14" fill="#000000" opacity=".25"/>

    <rect x="106" y="150" width="510" height="196" rx="28" fill="url(#hbody)"/>
    <rect x="106" y="282" width="510" height="16" fill="#f2a71b"/>
    <rect x="106" y="304" width="510" height="7" fill="#0d2a4f" opacity=".18"/>

    <!-- destination board -->
    <rect x="142" y="162" width="176" height="22" rx="7" fill="#0d2a4f"/>
    <text x="230" y="179" text-anchor="middle" font-family="Segoe UI, system-ui, Arial, sans-serif"
          font-size="13" font-weight="700" fill="#f2a71b" letter-spacing="1.5">KUET</text>

    <!-- windows -->
    <rect x="142" y="196" width="88" height="70" rx="12" fill="url(#hglass)"/>
    <rect x="244" y="196" width="88" height="70" rx="12" fill="url(#hglass)"/>
    <rect x="346" y="196" width="88" height="70" rx="12" fill="url(#hglass)"/>
    <path d="M516 196h64a16 16 0 0 1 16 16v54h-80z" fill="url(#hglass)"/>

    <!-- door -->
    <rect x="448" y="196" width="56" height="150" rx="9" fill="#c3d3e8"/>
    <rect x="476" y="196" width="3"  height="150" fill="#94accb"/>

    <!-- lights -->
    <rect x="598" y="272" width="18" height="26" rx="8" fill="#ffd77a"/>
    <rect x="106" y="272" width="14" height="24" rx="7" fill="#e2705f"/>

    <!-- wheels -->
    <circle cx="212" cy="352" r="44" fill="#101f38"/>
    <circle cx="212" cy="352" r="18" fill="#8fa3c0"/>
    <circle cx="512" cy="352" r="44" fill="#101f38"/>
    <circle cx="512" cy="352" r="18" fill="#8fa3c0"/>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".3">
    <path d="M36 214h50"/>
    <path d="M18 246h34"/>
    <path d="M44 278h40"/>
  </g>
</svg>
